[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ukast"
version = "0.1.0"
description = "U-shaped Kolmogorov-Arnold Swin Transformer for medical image segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.1",
  "monai>=1.3,<1.5",
]

[project.optional-dependencies]
triton = ["triton>=2.1", "kat-rational @ git+https://github.com/Adamdad/rational_kat_cu.git"]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["ukast*"]
